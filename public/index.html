<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <meta name="theme-color" content="#6c56e0" />
  <title>Vivaran Health</title>
  <!-- Applies the stored/system theme before the stylesheet loads, so there's
       no flash of the wrong theme. Kept in sync with js/util/theme.js. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("vivaran_theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <!-- Type pairing: Lexend for headings (designed for reading proficiency —
       a deliberate accessibility choice for an app used by older/less
       tech-fluent patients), Inter for body copy. Both fall back cleanly to
       system fonts in style.css if this fails to load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Client-side QR code generation, vendored locally (see js/vendor/qrcode.min.js)
       so it doesn't depend on a CDN being reachable at runtime. -->
  <script src="js/vendor/qrcode.min.js"></script>

  <!--
    Running in local/offline mode (see public/js/dataClient.js) — no Supabase
    project needed right now. To reconnect Supabase later, uncomment these two
    tags and copy public/js/config.example.js to public/js/config.js:

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
  -->

  <script type="module" src="js/app.js"></script>
</body>
</html>
